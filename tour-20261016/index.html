<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172c23">
  <link rel="icon" href="data:,">
  <title>住前走一遍 · 拱门与光影</title>
  <script type="module" crossorigin src="/zhongfan/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/zhongfan/assets/style-DonqSWeO.js"></script>
  <script type="module" crossorigin src="/zhongfan/assets/main-D5ROa-ar.js"></script>
  <link rel="stylesheet" crossorigin href="/zhongfan/assets/main-ChGoj-OJ.css">
  <link rel="stylesheet" crossorigin href="/zhongfan/assets/style-DkuWD8CW.css">
</head>
<body>
  <canvas id="world" aria-label="室内三维漫游，拖动环视，点击地面移动"></canvas>
  <header>
    <div class="brand"><span class="logo">⌂</span><div><strong>住前走一遍</strong><small>PHOTO / ROOM TOUR</small></div></div>
    <nav class="actions" aria-label="项目导航与漫游控制">
      <a class="page-tab" href="../">全部空间</a><a class="page-tab" href="../docs/">文档</a>
      <button id="pause" disabled>暂停</button><button id="reset" disabled>回到起点 ↗</button><button id="fullscreen">全屏 ⛶</button>
    </nav>
  </header>
  <main id="overlay">
    <div class="intro">
      <div class="eyebrow">EXPLORE THE ROOM</div><h1>拱门与光影</h1>
      <p>房间载入后自动开始漫游。<br>拖动环视，点击地面，按自己的节奏探索。</p>
      <button id="enter" disabled>正在载入房间…</button><div id="load-status" role="status" aria-live="polite">准备模型与空间导航</div>
      <div class="keys"><span><kbd>W A S D</kbd> 移动</span><span><kbd>拖动</kbd> 环视</span><span><kbd>点击地面</kbd> 前往</span></div>
    </div>
    <div class="room-card"><span>YOUR ROOM</span><strong>拱门与光影</strong><small>参考照片建模 · 第一人称漫游</small></div>
  </main>
  <div id="crosshair" hidden aria-hidden="true">+</div><div id="location">客厅</div>
  <aside id="map"><div><span>空间导览</span><small>◆ 你的位置</small></div><canvas id="minimap" width="300" height="220" aria-label="当前户型与玩家位置"></canvas><p>按实际模型绘制 · 朝向实时更新</p></aside>
  <footer><span id="hint" role="status">正在载入房间</span><span id="fps"></span><span>Esc 暂停 · Shift 加速</span></footer>
  <div id="touch-controls"><div id="joystick" role="application" aria-label="拖动摇杆移动"><i></i></div><span>左侧移动 · 右侧拖动环视</span></div>
</body>
</html>
