<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zhonglaoban</title>
  <style>
    :root { color-scheme: light dark; --bg: #0f1115; --fg: #e8eaed; --muted: #9aa0a6; --card: #1a1d24; --accent: #7aa2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    h2 { font-size: 1.15rem; margin: 36px 0 12px; }
    p, li { color: var(--muted); }
    .card { background: var(--card); border-radius: 12px; padding: 16px 18px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>你好，我是 zhonglaoban</h1>
    <p>个人博客 / 作品集，建设中。</p>

    <h2>简介</h2>
    <div class="card">
      <p>这里以后放一段简短自我介绍。</p>
    </div>

    <h2>作品</h2>
    <div class="card">
      <ul>
        <li>作品一（待补充）</li>
        <li>作品二（待补充）</li>
      </ul>
    </div>

    <h2>博客</h2>
    <div class="card">
      <p>第一篇文章还在路上。</p>
    </div>

    <h2>联系</h2>
    <div class="card">
      <p>GitHub：<a href="https://github.com/zhonglaoban">@zhonglaoban</a></p>
    </div>
  </main>
</body>
</html>
